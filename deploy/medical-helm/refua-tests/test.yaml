# Notes on how this chart differs from deploy/k8s/base/deployment.yaml:
# - Volumes: the chart mounts only an emptyDir at /tmp (no PVC, no extra volumes). Run history, logs and reports are
#   therefore ephemeral. Persistence needs a chart change (extra volumes) or the S3 archive (parked, Phase 4).
# - /dev/shm: stays at the 64 MB default. Chromium may crash on heavy pages. Fix: a memory emptyDir at /dev/shm
#   (chart change) or the --disable-dev-shm-usage launch argument in the core framework.
# - User: the chart forces runAsUser 1000 / runAsGroup 3000, with a read-only root filesystem. The image's pwuser is 1001.
#   Not tested: whether the service and Chromium start as uid 1000 with only /tmp writable.
# - Probes: the chart defines none. Kubernetes only checks that the process runs; /api/health is not probed.
# - Service account: the pod uses the namespace default. Terraform also created refua-tests-test-secrets-sa for
#   External Secrets. The pod does not need it.
