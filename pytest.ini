[pytest]
# Test Discovery Configuration
testpaths = refua_tests/tests refua_tests/bdd
python_files = test_*.py *Sanity.py
python_classes = Test* Meditik*
python_functions = test_*

# Output Options
addopts =
    -v
    --strict-markers
    --tb=short
    --capture=no
    --alluredir=allure/results
    -ra

# Test Markers
markers =
    sanity: Core sanity checks — verifies each screen and feature loads correctly
    ui: UI component checks — verifies interactive elements (widgets, speed-dial, CTAs)
    smoke: Quick sanity tests for critical functionality
    regression: Full regression test suite
    authentication: Authentication and authorization tests
    patient_management: Patient management and data tests
    performance: Performance and load tests
    slow: Tests that take longer than normal execution
    integration: Integration tests with external systems
    api: API endpoint tests
    data: Data validation tests
    accessibility: Accessibility compliance tests
    bdd: Gherkin behavior-driven test scenarios
    meditik: Tests for the Meditik application
    cprgo: Reserved for future CPRGO application tests
    home: Home dashboard scenarios
    menu: Side-menu navigation scenarios
    request_forms: Request-form scenarios
    known_issue: Product behavior currently tracked as expected failure
    env: Target environment marker (added automatically by the framework plugin)

# Timeout Configuration — requires pytest-timeout; install with: pip install pytest-timeout
# timeout = 300
# timeout_method = thread

# Logging Configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = test_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Console Output
console_output_style = progress
