name: BDD - Run by tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "BDD tag to run (list refreshed daily; see BDD_TAGS.md)"
        required: true
        type: choice
        # BEGIN BDD TAG OPTIONS (generated by tools/update_bdd_tags.py - do not edit by hand)
        options:
          - "bdd"
          - "home"
          - "known_issue"
          - "main_page"
          - "medical_profile"
          - "medicines"
          - "meditik"
          - "menu"
          - "my_appointments"
          - "my_requests"
          - "referrals"
          - "regression"
          - "request_forms"
          - "scheduling"
          - "sick_days"
          - "smoke"
          - "vaccinations"
          - "visit_summaries"
          - "new_referral — unavailable: all 30 scenarios pending clarification"
        # END BDD TAG OPTIONS
      personal_number:
        description: "TEST personal number for automation login + DB seed"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    # GitHub-hosted for now; set repository variable BDD_RUNNER (e.g. self-hosted) when a runner with TEST access exists.
    runs-on: ${{ vars.BDD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Resolve tag
        id: tag
        env:
          CHOICE: ${{ inputs.tag }}
        run: |
          if [[ "$CHOICE" == *"unavailable"* ]]; then
            echo "::error::Tag not runnable - ${CHOICE}"
            echo "### Tag not runnable" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${CHOICE}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "All scenarios with this tag are pending workbook clarification. See BDD_TAGS.md." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ! "$CHOICE" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::Invalid tag '${CHOICE}'"; exit 1
          fi
          echo "name=$CHOICE" >> "$GITHUB_OUTPUT"

      - name: Validate personal number
        env:
          PN: ${{ inputs.personal_number }}
        run: |
          [[ "$PN" =~ ^[0-9]+$ ]] || { echo "::error::personal_number must be digits"; exit 1; }

      - uses: actions/checkout@v4
        with:
          path: refuaAutomationTests

      - uses: actions/checkout@v4
        with:
          repository: DigitalIDF/refuaAutomationCore
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: refuaAutomationCore

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: refuaAutomationTests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt allure-pytest
          pip install -e ../refuaAutomationCore
          python -m playwright install --with-deps chromium

      - name: Write .env.test
        working-directory: refuaAutomationTests
        env:
          ENV_TEST: ${{ secrets.ENV_TEST }}
        run: |
          [[ -n "$ENV_TEST" ]] || { echo "::error::Repository secret ENV_TEST (contents of .env.test) is not set"; exit 1; }
          printf '%s\n' "$ENV_TEST" > .env.test

      - name: Run BDD @${{ steps.tag.outputs.name }}
        working-directory: refuaAutomationTests
        env:
          TEST_ENV: test
          TAG: ${{ steps.tag.outputs.name }}
          PN: ${{ inputs.personal_number }}
        run: python -m pytest refua_tests/bdd -m "$TAG" --personal-number "$PN" --headless

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ steps.tag.outputs.name }}-${{ github.run_number }}
          path: refuaAutomationTests/allure/results
          if-no-files-found: ignore
