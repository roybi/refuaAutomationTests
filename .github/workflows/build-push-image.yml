name: Docker - Build and push to GHCR (ECR pull-through)

# One workflow, two images, built in order and pushed to GitHub Container Registry (ghcr.io):
#   1. refua-automation-core   (Playwright + refua_core, from the refuaAutomationCore repo)  -> base image
#   2. refua-automation-tests  (FROM the core image: runner API + UI + Allure + this repo's tests)
# DigitalIDF mirrors ghcr.io/digitalidf/... into ECR automatically (ECR pull-through cache), so no AWS credentials or
# ECR repositories are needed here. Pull address after the push:
#   373007444960.dkr.ecr.il-central-1.amazonaws.com/ghcr/digitalidf/<repo>/<image>:<tag>
# Setup and the required variables/secrets: docs/guides/DOCKER_PIPELINE.md

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "refuaAutomationCore branch/tag/SHA to bake into the base image (blank = repo variable CORE_REF)"
        required: false
        type: string
      extra_tag:
        description: "Optional extra tag for the tests image, e.g. v1.4.0"
        required: false
        type: string
      push_images:
        description: "Push the images to ghcr.io (turn off for a build + smoke test only)"
        required: true
        type: boolean
        default: true
      push_latest:
        description: "Also move the 'latest' tag"
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "refua_service/**"
      - "refua_tests/**"
      - "tools/update_bdd_tags.py"
      - "requirements*.txt"
      - "run_tests.py"
      - "conftest.py"
      - "pytest.ini"
      - ".dockerignore"
      - ".github/workflows/build-push-image.yml"

permissions:
  contents: read
  packages: write # push to ghcr.io with the built-in GITHUB_TOKEN

concurrency:
  group: build-push-image
  cancel-in-progress: false

env:
  BASE_IMAGE: ${{ vars.BASE_IMAGE }}
  # Tests need refua-core >= 2.0.1 (automation login). Until it is on the core default branch, build from this ref.
  CORE_REF: ${{ inputs.core_ref || vars.CORE_REF || 'feat/meditik-element-scraper' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        env:
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          if [[ -n "$EXTRA_TAG" && ! "$EXTRA_TAG" =~ ^[A-Za-z0-9_.-]{1,64}$ ]]; then
            echo "::error::extra_tag may only contain letters, digits, '_', '.', '-'"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: refuaAutomationTests

      - uses: actions/checkout@v4
        with:
          repository: DigitalIDF/refuaAutomationCore
          ref: ${{ env.CORE_REF }}
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: refuaAutomationCore

      - name: Resolve image names and tags
        id: meta
        env:
          EXTRA_TAG: ${{ inputs.extra_tag }}
          PUSH_IMAGES: ${{ github.event_name == 'push' || inputs.push_images }}
          PUSH_LATEST: ${{ github.event_name == 'push' || inputs.push_latest }}
        run: |
          core_sha=$(git -C refuaAutomationCore rev-parse --short=12 HEAD)
          tests_sha=$(git -C refuaAutomationTests rev-parse --short=12 HEAD)
          core_version=$(python3 -c "exec(open('refuaAutomationCore/refua_core/version.py').read()); print(__version__)")
          # ghcr.io/<owner>/<repo>/<image> - all lowercase, as required by the registry and the ECR pull-through rule
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"; repo="${repo,,}"
          {
            echo "core_sha=$core_sha"
            echo "tests_sha=$tests_sha"
            echo "core_version=$core_version"
            echo "push_images=$PUSH_IMAGES"
            echo "push_latest=$PUSH_LATEST"
            echo "extra_tag=$EXTRA_TAG"
            echo "core_image=ghcr.io/$owner/$repo/refua-automation-core"
            echo "tests_image=ghcr.io/$owner/$repo/refua-automation-tests"
            echo "ecr_prefix=373007444960.dkr.ecr.il-central-1.amazonaws.com/ghcr/$owner/$repo"
          } >> "$GITHUB_OUTPUT"
          if [[ "$core_version" == 1.* ]]; then
            echo "::error::refuaAutomationCore ref '$CORE_REF' is version $core_version; the tests need >= 2.0.1 (automation login). Set CORE_REF to a newer ref."
            exit 1
          fi

      - name: Build core base image
        run: |
          base_args=()
          [[ -n "$BASE_IMAGE" ]] && base_args=(--build-arg "BASE_IMAGE=${BASE_IMAGE}")  # blank = Microsoft's Playwright image
          docker build \
            -f refuaAutomationTests/docker/core/Dockerfile \
            "${base_args[@]}" \
            --build-arg "CORE_REF=${CORE_REF}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t refua-core-local:${{ steps.meta.outputs.core_sha }} \
            refuaAutomationCore

      - name: Build tests image (FROM the core image)
        run: |
          docker build \
            -f refuaAutomationTests/docker/tests/Dockerfile \
            --build-arg "CORE_IMAGE=refua-core-local:${{ steps.meta.outputs.core_sha }}" \
            --build-arg "APP_VERSION=${{ steps.meta.outputs.tests_sha }}" \
            --build-arg "GIT_SHA=${{ github.sha }}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t refua-tests-local:${{ steps.meta.outputs.tests_sha }} \
            refuaAutomationTests

      - name: Smoke test the tests image (no secrets, no network to the app)
        run: |
          image=refua-tests-local:${{ steps.meta.outputs.tests_sha }}
          docker run --rm "$image" sh -c '
            "$ALLURE_BIN" --version &&
            python -c "import refua_core.version as v; print(\"refua-core\", v.__version__)" &&
            python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); print(\"chromium\", b.version); b.close(); p.stop()" &&
            python run_tests.py --list-systems &&
            python run_tests.py --system meditik --user 4444401 --env test -- --collect-only -q > /tmp/collect.txt 2>&1
            code=$?
            grep -E "^(ERROR|E  )" /tmp/collect.txt | head -30
            tail -3 /tmp/collect.txt
            exit $code'
          docker run -d --name svc -p 8080:8080 "$image"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/options | grep -q '"meditik"'
          curl -fsS http://127.0.0.1:8080/ | grep -q "Refua automation runner"
          docker rm -f svc

      - name: Log in to ghcr.io
        if: steps.meta.outputs.push_images == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push images
        if: steps.meta.outputs.push_images == 'true'
        env:
          CORE_IMAGE: ${{ steps.meta.outputs.core_image }}
          TESTS_IMAGE: ${{ steps.meta.outputs.tests_image }}
          CORE_SHA: ${{ steps.meta.outputs.core_sha }}
          TESTS_SHA: ${{ steps.meta.outputs.tests_sha }}
          PUSH_LATEST: ${{ steps.meta.outputs.push_latest }}
          EXTRA_TAG: ${{ steps.meta.outputs.extra_tag }}
          ECR_PREFIX: ${{ steps.meta.outputs.ecr_prefix }}
        run: |
          push_tags() {  # <local image> <registry image> <tag>...
            local src="$1" dest="$2"; shift 2
            for tag in "$@"; do
              docker tag "$src" "$dest:$tag"
              docker push "$dest:$tag"
            done
          }
          core_tags=("$CORE_SHA");  [[ "$PUSH_LATEST" == "true" ]] && core_tags+=("latest")
          tests_tags=("$TESTS_SHA"); [[ "$PUSH_LATEST" == "true" ]] && tests_tags+=("latest")
          [[ -n "$EXTRA_TAG" ]] && tests_tags+=("$EXTRA_TAG")
          push_tags "refua-core-local:$CORE_SHA"   "$CORE_IMAGE"  "${core_tags[@]}"
          push_tags "refua-tests-local:$TESTS_SHA" "$TESTS_IMAGE" "${tests_tags[@]}"
          {
            echo "### Images pushed to ghcr.io"
            echo "| Image | Tags |"
            echo "|---|---|"
            echo "| \`$CORE_IMAGE\` | $(printf '`%s` ' "${core_tags[@]}") (refua-core ${{ steps.meta.outputs.core_version }}, ref \`$CORE_REF\`) |"
            echo "| \`$TESTS_IMAGE\` | $(printf '`%s` ' "${tests_tags[@]}") |"
            echo
            echo "Pull through ECR (after the pull-through cache fetches it):"
            echo "\`$ECR_PREFIX/refua-automation-tests:$TESTS_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
