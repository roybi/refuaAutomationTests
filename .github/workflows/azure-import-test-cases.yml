name: Azure - Import Excel test cases

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment containing your AZURE_DEVOPS_PAT secret"
        required: true
        type: environment
        default: azure-test-import
      excel_file:
        description: "Repository-relative .xlsx path (upload through Code first)"
        required: true
        type: string
      organization:
        description: "Azure DevOps organization name, not a URL"
        required: true
        type: string
        default: ShaharDigital
      project:
        description: "Azure DevOps project"
        required: true
        type: string
        default: MedicalCenter
      plan:
        description: "Test Plan name (AUTO_ prefix is added automatically)"
        required: true
        type: string
        default: Automation Test Cases
      sheet:
        description: "Excel worksheet name"
        required: true
        type: string
        default: Test Cases
      suite:
        description: "Optional suite override; otherwise Module/Feature column is used"
        required: false
        type: string
      dry_run:
        description: "Validate Excel only; uncheck to CREATE or UPDATE Azure test cases"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: azure-testcase-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/azure-import-requirements.txt

      - name: Install importer dependencies
        run: python -m pip install -r tools/azure-import-requirements.txt

      - name: Run importer unit tests (no Azure calls)
        run: python -m unittest discover -s tools/tests -p test_azure_testcase_importer.py -v

      - name: Import or validate Excel
        env:
          EXCEL_FILE: ${{ inputs.excel_file }}
          ORGANIZATION: ${{ inputs.organization }}
          PROJECT: ${{ inputs.project }}
          PLAN: ${{ inputs.plan }}
          SHEET: ${{ inputs.sheet }}
          SUITE: ${{ inputs.suite }}
          DRY_RUN: ${{ inputs.dry_run }}
          AZURE_DEVOPS_PAT: ${{ !inputs.dry_run && secrets.AZURE_DEVOPS_PAT || '' }}
          PYTHONUTF8: "1"
        run: |
          workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          workbook="$(realpath -e -- "$EXCEL_FILE")"
          if [[ "$workbook" != "$workspace/"* || ! -f "$workbook" || "${workbook,,}" != *.xlsx ]]; then
            echo "::error::Choose an .xlsx file inside this repository."
            exit 2
          fi
          git ls-files --error-unmatch -- "$EXCEL_FILE" > /dev/null
          args=("$workbook" "--organization=$ORGANIZATION" "--project=$PROJECT" "--plan=$PLAN" "--sheet=$SHEET")
          if [[ -n "$SUITE" ]]; then
            args+=("--suite=$SUITE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          elif [[ -z "$AZURE_DEVOPS_PAT" ]]; then
            echo "::error::Configure AZURE_DEVOPS_PAT in the selected GitHub Environment before a live import."
            exit 2
          fi
          if python tools/azure_testcase_importer.py "${args[@]}"; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Excel validation passed. No Azure requests were sent; credentials and permissions were not checked." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Azure import completed. See the step log for created/updated test-case IDs and suite links." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Import failed. Inspect the step log. A live import may have applied some changes; there is no automatic rollback." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi