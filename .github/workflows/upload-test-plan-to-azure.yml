name: Upload Test Plan to Azure

on:
  workflow_dispatch:
    inputs:
      excel_path:
        description: "Excel path in this repository, e.g. uploads/Visit_Summaries_Test_Cases.xlsx"
        required: true
        type: string
      plan_name:
        description: "Azure Test Plan name (AUTO_ is added automatically)"
        required: true
        type: string
      sheet_name:
        description: "Worksheet containing the test cases"
        required: true
        default: Test_Cases
        type: string
      organization:
        description: "Azure DevOps organization"
        required: true
        default: ShaharDigital
        type: string
      project:
        description: "Azure DevOps project"
        required: true
        default: MedicalCenter
        type: string
      suite:
        description: "Optional suite override; otherwise use Module/Feature from Excel"
        required: false
        type: string
      dry_run:
        description: "Validate Excel only, without changing Azure DevOps"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: azure-test-case-import
  cancel-in-progress: false

jobs:
  upload:
    name: Validate and import test cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXCEL_PATH: ${{ inputs.excel_path }}
      PLAN_NAME: ${{ inputs.plan_name }}
      SHEET_NAME: ${{ inputs.sheet_name }}
      AZURE_ORGANIZATION: ${{ inputs.organization }}
      AZURE_PROJECT: ${{ inputs.project }}
      SUITE_NAME: ${{ inputs.suite }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/azure_test_importer/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/azure_test_importer/requirements.txt

      - name: Validate workbook
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          supplied_path = Path(os.environ["EXCEL_PATH"])
          excel = (workspace / supplied_path).resolve()
          if supplied_path.is_absolute() or not excel.is_relative_to(workspace):
              raise SystemExit("Excel path must be relative to and inside this repository.")
          if excel.suffix.lower() != ".xlsx" or not excel.is_file():
              raise SystemExit("Excel file not found. Upload an .xlsx file to the selected branch first.")
          command = [
              sys.executable, str(workspace / "tools/azure_test_importer/azure_testcase_importer.py"), str(excel),
              "--plan", os.environ["PLAN_NAME"],
              "--sheet", os.environ["SHEET_NAME"],
              "--organization", os.environ["AZURE_ORGANIZATION"],
              "--project", os.environ["AZURE_PROJECT"],
          ]
          if os.environ.get("SUITE_NAME", "").strip():
              command.extend(["--suite", os.environ["SUITE_NAME"]])
          subprocess.run(command + ["--dry-run"], check=True)
          Path(os.environ["RUNNER_TEMP"], "azure-import-command.json").write_text(
              json.dumps(command), encoding="utf-8"
          )

      - name: Upload test plan to Azure
        if: ${{ !inputs.dry_run }}
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        shell: python
        run: |
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          pat = os.environ.get("AZURE_DEVOPS_PAT", "").strip()
          if not pat:
              raise SystemExit(
                  "Missing AZURE_DEVOPS_PAT. Add it in Settings > Secrets and variables > Actions."
              )
          if any(character in pat for character in "\r\n"):
              raise SystemExit("AZURE_DEVOPS_PAT must not contain line breaks.")
          print("::add-mask::" + pat, flush=True)
          print("::add-mask::" + base64.b64encode((":" + pat).encode()).decode(), flush=True)
          os.environ["AZURE_DEVOPS_PAT"] = pat
          command = json.loads(
              Path(os.environ["RUNNER_TEMP"], "azure-import-command.json").read_text(encoding="utf-8")
          )
          subprocess.run(command, check=True)

      - name: Write run summary
        if: ${{ always() }}
        env:
          VALIDATION_ONLY: ${{ inputs.dry_run }}
          JOB_STATUS: ${{ job.status }}
        shell: python
        run: |
          import os
          from pathlib import Path

          mode = "Excel validation only; no Azure changes" if os.environ["VALIDATION_ONLY"] == "true" else "Azure import"
          summary = "# Upload Test Plan to Azure\n\n"
          summary += "Mode: " + mode + "\n\n"
          summary += "Status: " + os.environ["JOB_STATUS"] + "\n\n"
          summary += "See the validation/import step logs for case counts, CREATED/UPDATED IDs, and errors.\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write(summary)