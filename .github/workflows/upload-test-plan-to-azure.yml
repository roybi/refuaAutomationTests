name: Upload Test Plan to Azure
run-name: "Azure import - ${{ inputs.upload_id || inputs.plan_name }}"

on:
  workflow_dispatch:
    inputs:
      excel_path:
        description: "Repository path for validation only; use local_upload.py to choose a PC file"
        required: false
        type: string
      upload_id:
        description: "Temporary upload ID, filled automatically by local_upload.py"
        required: false
        type: string
      plan_name:
        description: "Azure Test Plan name (AUTO_ is added automatically)"
        required: true
        type: string
      sheet_name:
        description: "Worksheet containing the test cases"
        required: true
        default: Test_Cases
        type: string
      organization:
        description: "Azure DevOps organization"
        required: true
        default: ShaharDigital
        type: string
      project:
        description: "Azure DevOps project"
        required: true
        default: MedicalCenter
        type: string
      suite:
        description: "Optional suite override; otherwise use Module/Feature from Excel"
        required: false
        type: string
      dry_run:
        description: "Validate Excel only, without changing Azure DevOps"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: azure-test-case-import
  cancel-in-progress: false

jobs:
  upload:
    name: Validate and import test cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      EXCEL_PATH: ${{ inputs.excel_path }}
      UPLOAD_ID: ${{ inputs.upload_id }}
      VALIDATION_ONLY: ${{ inputs.dry_run }}
      PLAN_NAME: ${{ inputs.plan_name }}
      SHEET_NAME: ${{ inputs.sheet_name }}
      AZURE_ORGANIZATION: ${{ inputs.organization }}
      AZURE_PROJECT: ${{ inputs.project }}
      SUITE_NAME: ${{ inputs.suite }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/azure_test_importer/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/azure_test_importer/requirements.txt

      - name: Validate workbook
        env:
          GH_TOKEN: ${{ inputs.upload_id != '' && github.token || '' }}
        run: python tools/azure_test_importer/workflow_runner.py validate

      - name: Upload test plan to Azure
        if: ${{ !inputs.dry_run }}
        env:
          AZURE_DEVOPS_PAT: ${{ secrets[format('AZURE_IMPORT_PAT_{0}', inputs.upload_id)] }}
        run: python tools/azure_test_importer/workflow_runner.py upload

      - name: Delete temporary workbook upload
        if: ${{ always() && inputs.upload_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/azure_test_importer/workflow_runner.py cleanup

      - name: Write run summary
        if: ${{ always() }}
        env:
          VALIDATION_ONLY: ${{ inputs.dry_run }}
          JOB_STATUS: ${{ job.status }}
        run: python tools/azure_test_importer/workflow_runner.py summary